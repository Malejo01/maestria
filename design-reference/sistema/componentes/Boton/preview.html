<!-- @dsCard group="Controles" height=180 subtitle="Principal, secundario, de barra y el grande de celular" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; font-family: var(--font-texto, Inter, system-ui, sans-serif); background: var(--superficie-base); color: var(--texto); }
  .marco { padding: 24px 28px; display: flex; flex-direction: column; gap: 18px; }
  .fila { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  button { font-family: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
  .principal { font-size: 13.5px; font-weight: 700; padding: 10px 15px; border: none; border-radius: var(--radio-md); background: var(--accion); color: var(--texto-sobre-accion); }
  .principal:hover { background: var(--accion-hover); }
  .secundario { font-size: 13.5px; font-weight: 700; padding: 10px 15px; border: 1.5px solid var(--borde-fuerte); border-radius: var(--radio-md); background: var(--superficie-tarjeta); color: var(--texto); }
  .secundario:hover { border-color: var(--texto); }
  .icono { width: 44px; height: 44px; border: 1px solid var(--borde); border-radius: var(--radio-md); background: var(--superficie-tarjeta); display: inline-flex; align-items: center; justify-content: center; }
  .grande { display: block; width: 240px; text-align: left; border: none; border-radius: var(--radio-lg); padding: 16px 17px; background: var(--accion); }
  .grande .t { font-size: 16px; font-weight: 700; color: var(--texto-sobre-accion); }
  .grande .s { font-size: 12px; color: var(--texto-sobre-accion); opacity: .75; margin-top: 2px; }
  .grande.hueco { background: var(--superficie-tarjeta); border: 1.5px solid var(--texto); }
  .grande.hueco .t { color: var(--texto); }
  .grande.hueco .s { color: var(--texto-suave); opacity: 1; }
  .pie { font-size: 11px; color: var(--texto-suave); }
</style>
</head>
<body>
<div class="marco">

  <div class="fila">
    <button type="button" class="principal">Armar tarea</button>
    <button type="button" class="secundario">Ver la ficha</button>
    <button type="button" class="icono" aria-label="Cambiar a modo oscuro">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="var(--texto-suave)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg>
    </button>
    <span class="pie">Principal · Secundario · Solo ícono (44 px de área táctil)</span>
  </div>

  <div class="fila">
    <button type="button" class="grande">
      <span class="t">Soy docente</span>
      <span class="s" style="display:block">Armo temarios y mando tareas</span>
    </button>
    <button type="button" class="grande hueco">
      <span class="t">Soy alumno</span>
      <span class="s" style="display:block">Practico y rindo mis tareas</span>
    </button>
    <span class="pie">Grande de celular: dos líneas, radio-lg</span>
  </div>

</div>
</body>
</html>
