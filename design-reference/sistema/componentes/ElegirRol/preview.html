<!-- @dsCard group="Entrada" height=600 subtitle="La puerta: rol arriba, código abajo, nada más" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
  body { margin: 0; font-family: var(--font-texto, Inter, system-ui, sans-serif); background: var(--superficie-base); color: var(--texto); }
  .marco { padding: 20px; display: flex; justify-content: center; }
  .tel { width: 300px; box-sizing: border-box; background: var(--superficie-tarjeta); border: 1px solid var(--borde); border-radius: var(--radio-xl); padding: 32px 24px; }
  .marca { display: flex; align-items: center; gap: 9px; justify-content: center; margin-bottom: 30px; }
  .logotipo { font-family: var(--font-display, "Plus Jakarta Sans", sans-serif); font-size: 21px; font-weight: 800; letter-spacing: -0.02em; }
  .ia { color: var(--accion); }
  h1 { margin: 0 0 5px; font-family: var(--font-display, "Plus Jakarta Sans", sans-serif); font-size: 25px; font-weight: 800; line-height: 1.15; letter-spacing: -0.025em; }
  .bajada { margin: 0 0 22px; font-size: 13px; line-height: 1.45; color: var(--texto-suave); }
  .opcion { display: block; width: 100%; box-sizing: border-box; text-align: left; font-family: inherit; border: none; border-radius: var(--radio-lg); padding: 16px 17px; margin-bottom: 11px; background: var(--accion); cursor: pointer; }
  .opcion:hover { background: var(--accion-hover); }
  .opcion:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
  .opcion .t { display: block; font-size: 16px; font-weight: 700; color: var(--texto-sobre-accion); }
  .opcion .s { display: block; font-size: 12px; color: var(--texto-sobre-accion); opacity: .75; margin-top: 2px; }
  .opcion.hueco { background: var(--superficie-tarjeta); border: 1.5px solid var(--texto); margin-bottom: 22px; }
  .opcion.hueco:hover { background: var(--superficie-suave); }
  .opcion.hueco .t { color: var(--texto); }
  .opcion.hueco .s { color: var(--texto-suave); opacity: 1; }
  .o { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .o span { font-size: 11px; color: var(--texto-suave); font-weight: 600; }
  .o i { flex-grow: 1; height: 1px; background: var(--borde); }
  label { display: block; font-size: 12px; font-weight: 600; color: var(--texto-suave); margin-bottom: 8px; }
  .campo { display: flex; gap: 8px; }
  input { flex-grow: 1; min-width: 0; box-sizing: border-box; font-family: inherit; font-size: 15px; letter-spacing: .14em; padding: 13px; border: 1px solid var(--borde-fuerte); border-radius: var(--radio-md); background: var(--superficie-tarjeta); color: var(--texto); }
  input:focus-visible { outline: 2px solid var(--foco); outline-offset: 2px; }
  .ir { font-family: inherit; font-size: 14px; font-weight: 700; padding: 13px 17px; border: none; border-radius: var(--radio-md); background: var(--texto); color: var(--superficie-tarjeta); cursor: pointer; }
</style>
</head>
<body>
<div class="marco">
  <div class="tel">
    <div class="marca">
      <svg viewBox="-22.2 -29.7 144.4 144.4" width="28" height="28" aria-hidden="true" style="color: var(--accion); flex: none">
        <g fill="none" stroke="currentColor" stroke-width="4.8" stroke-linejoin="round">
          <path d="M-11.8 0 L-11.8 85 A11.8 11.8 0 0 0 11.8 85 L11.8 0 A11.8 11.8 0 0 0 -11.8 0 Z"></path>
          <path d="M88.2 0 L88.2 85 A11.8 11.8 0 0 0 111.8 85 L111.8 0 A11.8 11.8 0 0 0 88.2 0 Z"></path>
          <path d="M-8.34 8.34 L41.66 58.34 A11.8 11.8 0 0 0 58.34 41.66 L8.34 -8.34 A11.8 11.8 0 0 0 -8.34 8.34 Z"></path>
          <path d="M91.66 -8.34 L41.66 41.66 A11.8 11.8 0 0 0 58.34 58.34 L108.34 8.34 A11.8 11.8 0 0 0 91.66 -8.34 Z"></path>
          <circle cx="0" cy="0" r="9.8"></circle><circle cx="0" cy="85" r="9.8"></circle>
          <circle cx="100" cy="0" r="9.8"></circle><circle cx="100" cy="85" r="9.8"></circle>
          <circle cx="50" cy="50" r="9.8"></circle>
        </g>
      </svg>
      <span class="logotipo">Maestr<span class="ia">IA</span></span>
    </div>

    <h1>¿Cómo entrás?</h1>
    <p class="bajada">Elegí una vez. Después lo podés cambiar desde tu perfil.</p>

    <button type="button" class="opcion">
      <span class="t">Soy docente</span>
      <span class="s">Armo temarios y mando tareas</span>
    </button>

    <button type="button" class="opcion hueco">
      <span class="t">Soy alumno</span>
      <span class="s">Practico y rindo mis tareas</span>
    </button>

    <div class="o"><i></i><span>o</span><i></i></div>

    <label for="cod">Tu profe te pasó un código</label>
    <div class="campo">
      <input id="cod" type="text" placeholder="7K4P2M" autocomplete="off">
      <button type="button" class="ir">Ir</button>
    </div>
  </div>
</div>
</body>
</html>
